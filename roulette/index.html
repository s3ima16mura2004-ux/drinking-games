<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>宴のロシアンルーレット</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hit-flash" id="hitFlash"></div>

    <div class="app-content">

        <div class="page-header">
            <div>
                <a href="../index.html" class="menu-link">⬅ メニューに戻る</a>
            </div>

            <div class="subtitle">宴の運試し</div>
            <h1>ロシアンルーレット</h1>
        </div>

        <div class="screen-wrapper">

            <!-- 【ステップ1】 参加人数＆プレイヤー名入力画面 -->
            <div class="card-box" id="setupScreen">
                <h2>参加人数を決めよう</h2>
                <div class="player-count-control">
                    <button class="count-btn" onclick="changeCount(-1)">−</button>
                    <span id="playerCountText" style="font-size: 32px; font-weight: bold;">3</span>
                    <button class="count-btn" onclick="changeCount(1)">＋</button>
                </div>
                <p style="color: #aaa; font-size: 14px; margin-bottom: 20px;">2〜8人まで対応してるよ</p>

                <div id="nameInputsContainer" class="name-inputs">
                    <!-- JavaScriptで動的に生成されます -->
                </div>

                <div class="option-group">
                    <h3>ゲームモード</h3>
                    <div class="chamber-select">
                        <button class="chamber-btn" data-gamemode="classic" onclick="selectGameMode('classic')">🎯<br><span>クラシック</span></button>
                        <button class="chamber-btn active" data-gamemode="lap" onclick="selectGameMode('lap')">🔁<br><span>周回制</span></button>
                    </div>
                    <p class="option-hint" id="gameModeHint">周回制：全員が一周し終わるまで続行。複数人が当たることもあります</p>
                </div>

                <div class="option-group">
                    <h3>周回数 <span style="color:#aaa; font-weight:normal; font-size:12px;">(人数に応じて弾倉の数が決まるよ)</span></h3>
                    <div class="chamber-select">
                        <button class="chamber-btn active" data-rounds="1" onclick="selectRounds(1)">×1周</button>
                        <button class="chamber-btn" data-rounds="1.5" onclick="selectRounds(1.5)">×1.5周</button>
                        <button class="chamber-btn" data-rounds="2" onclick="selectRounds(2)">×2周</button>
                    </div>
                </div>

                <div class="option-group" id="riskGroup">
                    <h3>危険度</h3>
                    <div class="chamber-select">
                        <button class="chamber-btn" data-risk="low" onclick="selectRisk('low')">😌<br><span>低い(約10%)</span></button>
                        <button class="chamber-btn active" data-risk="standard" onclick="selectRisk('standard')">😳<br><span>標準(約20%)</span></button>
                        <button class="chamber-btn" data-risk="high" onclick="selectRisk('high')">😱<br><span>高い(約35%)</span></button>
                    </div>
                </div>

                <p class="settings-summary" id="settingsSummary"></p>

                <div class="option-group">
                    <h3>罰ゲームのジャンルを選ぼう <span style="color:#aaa; font-weight:normal; font-size:12px;">(複数選択可)</span></h3>
                    <div class="chamber-select" id="categorySelect">
                        <button class="chamber-btn active" data-cat="drink" onclick="toggleCategory('drink')">🍻<br><span>お酒系</span></button>
                        <button class="chamber-btn active" data-cat="talk" onclick="toggleCategory('talk')">🗣️<br><span>トーク系</span></button>
                        <button class="chamber-btn active" data-cat="dare" onclick="toggleCategory('dare')">🎭<br><span>無茶ぶり系</span></button>
                    </div>
                </div>

                <div class="option-group">
                    <h3>罰ゲームの決め方</h3>
                    <div class="chamber-select" id="modeSelect">
                        <button class="chamber-btn active" data-mode="random" onclick="selectPenaltyMode('random')">🎲<br><span>ランダム</span></button>
                        <button class="chamber-btn" data-mode="neighbor" onclick="selectPenaltyMode('neighbor')">🙋<br><span>次の人が決める</span></button>
                    </div>
                </div>

                <div class="option-group">
                    <h3>オリジナル罰ゲームを追加 <span style="color:#aaa; font-weight:normal; font-size:12px;">(任意)</span></h3>
                    <div class="custom-penalty-row">
                        <input type="text" id="customPenaltyInput" class="name-input" placeholder="例：モノマネを1つ披露する" style="margin-bottom:0;">
                        <button class="add-btn" onclick="addCustomPenalty()">追加</button>
                    </div>
                    <ul id="customPenaltyList" class="custom-penalty-list"></ul>
                </div>
            </div>

            <!-- 【ステップ2】 ゲーム本番画面 -->
            <div class="card-box" id="gameScreen" style="display: none;">
                <button class="settings-link" onclick="backToSetup()">⚙️ 設定に戻る</button>

                <div class="turn-indicator" id="turnIndicator">プレイヤー1の番</div>

                <div id="comboBanner" class="combo-banner"></div>

                <div class="cylinder-wrap">
                    <div id="cylinderSvgContainer"></div>
                    <div class="status" id="status">🥃</div>
                </div>

                <div id="message">順番に引き金を引いてね...</div>

                <div id="penaltyPicker" class="penalty-picker" style="display:none;"></div>

                <div id="resultSummary" class="result-summary" style="display:none;"></div>
            </div>

        </div>

    </div>

    <div class="bottom-bar">
        <button class="action-btn" id="startBtn" onclick="startGame()">ゲーム開始</button>
        <button class="action-btn pulse-btn" id="shootBtn" onclick="pullTrigger()" style="display:none;">引き金を引く！</button>
        <button class="action-btn" id="restartBtn" onclick="resetGame()" style="display:none; background: #2ecc71; color: #fff;">もう一度遊ぶ</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
