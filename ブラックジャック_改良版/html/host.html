<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宴会ブラックジャック - ホスト画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link href="../css/common.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="lantern-glow" aria-hidden="true"></div>

<header class="site-header">
  <p class="eyebrow">ホスト画面(共有スクリーン用)</p>
  <h1>🏮 宴会ブラックジャック 🏮</h1>
</header>

<main id="app">

  <!-- ============ ルーム作成前 ============ -->
  <section id="screen-create" class="screen screen--active">
    <div class="panel">
      <h2>ルームを作ろう</h2>
      <p class="hint">「ルームを作成」を押すとコードが発行されます。参加者はそのコードを自分のスマホで入力して参加します。</p>
      <button id="btnCreateRoom" class="btn btn--primary" type="button">ルームを作成</button>
    </div>
  </section>

  <!-- ============ ロビー(参加待ち) ============ -->
  <section id="screen-lobby" class="screen">
    <div class="panel">
      <h2>参加者を待っています</h2>
      <p class="hint">みんなにこのコードを伝えてね</p>
      <div id="roomCodeDisplay" class="room-code">----</div>
      <div id="qrCode" class="qr-wrap"></div>
      <p class="hint">スマホのカメラでQRコードを読み取ると、コード入力なしで参加できます</p>
      <div id="lobbyPlayerList" class="player-chip-list"></div>
      <p class="hint" id="lobbyCountHint">まだ誰も参加していません</p>
      <button id="btnStartGame" class="btn btn--primary" type="button" disabled>ゲーム開始(2人以上で押せます)</button>
    </div>
  </section>

  <!-- ============ ゲーム画面(卓全体表示) ============ -->
  <section id="screen-game" class="screen">
    <div class="round-bar round-bar-row">
      <span id="roundLabel">ラウンド 1</span>
      <div class="round-bar-right">
        <span id="turnLabel" class="turn-label"></span>
        <span id="turnTimerDisplay" class="turn-timer"></span>
        <button id="btnForceAdvance" class="btn btn--ghost btn--small" type="button">⏭ 強制的に進める</button>
      </div>
    </div>

    <div id="eventBanner" class="event-banner hidden">
      <p class="modal-eyebrow">🏮 ちょうちんタイム 🏮</p>
      <p id="eventBannerTarget" class="modal-target"></p>
      <p id="eventBannerText" class="modal-text"></p>
      <p class="timer"><span id="eventBannerTimer">15</span></p>
    </div>

    <div class="table-felt">
      <div id="playersOverview"></div>
    </div>
  </section>

  <!-- ============ 結果画面 ============ -->
  <section id="screen-result" class="screen">
    <div class="panel">
      <h2>🏮 結果発表 🏮</h2>
      <ul id="resultList" class="result-list"></ul>
      <p id="pendingPenaltyHint" class="hint hidden"></p>
      <div class="actions">
        <button id="btnNextRound" class="btn btn--primary" type="button">次のラウンドへ</button>
        <button id="btnEndRoom" class="btn" type="button">ルームを終了する</button>
      </div>
    </div>
  </section>

</main>

<div id="effectToast" class="toast"></div>

<script type="module" src="../js/host.js"></script>
</body>
</html>
