<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宴会ブラックジャック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f2b21; --felt:#16402f; --gold:#d4a13a; --gold-soft:#ecd291;
    --cream:#f3ead2; --line:#3c5c4a; --ink:#16231d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:2rem; padding:2rem;
    background:radial-gradient(circle at 50% -10%, #1c4a36 0%, var(--bg) 55%);
    color:var(--cream); font-family:"Zen Kaku Gothic New", sans-serif;
  }
  h1{
    font-family:"Shippori Mincho", serif; font-weight:800; margin:0;
    font-size:clamp(1.6rem, 5vw, 2.4rem); color:var(--gold-soft);
    text-shadow:0 0 18px rgba(212,161,58,0.35); text-align:center;
  }
  .cards{ display:flex; flex-direction:column; gap:1rem; width:100%; max-width:420px; }
  a.card{
    display:block; text-decoration:none; color:var(--cream);
    background:var(--felt); border:1px solid var(--line); border-radius:16px;
    padding:1.2rem 1.4rem; transition:transform 0.15s ease, border-color 0.15s ease;
  }
  a.card:hover{ transform:translateY(-2px); border-color:var(--gold); }
  a.card strong{ display:block; font-size:1.05rem; color:var(--gold-soft); margin-bottom:0.3rem; }
  a.card span{ font-size:0.85rem; color:rgba(243,234,210,0.75); }
</style>
</head>
<body>
  <h1>🏮 宴会ブラックジャック 🏮</h1>
  <div class="cards">
    <a class="card" href="html/index.html">
      <strong>1台で遊ぶ版(みんなで画面を回して遊ぶ)</strong>
      <span>2〜8人、1つの端末を順番に回して遊ぶタイプ</span>
    </a>
    <a class="card" href="html/host.html">
      <strong>リアルタイム版 - ホスト画面</strong>
      <span>お店のテレビやPCで開く共有画面(ルームを作成する側)</span>
    </a>
    <a class="card" href="html/player.html">
      <strong>リアルタイム版 - プレイヤー画面</strong>
      <span>各自のスマホで開く画面(ルームコードを入力して参加する側)</span>
    </a>
  </div>
</body>
</html>
