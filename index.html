<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飲み会ゲームセンター</title>
<style>
  :root {
    --gold: #f1c40f;
    --red: #e74c3c;
    --blue: #3498db;
    --green: #2ecc71;
    --purple: #9b59b6;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    margin: 0;
    min-height: 100vh;
    color: #fff;
    background:
      radial-gradient(circle at 20% 20%, rgba(241,196,15,0.15), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(231,76,60,0.15), transparent 40%),
      linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f0c29 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    overflow-x: hidden;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
  }

  h1 {
    color: var(--gold);
    font-size: clamp(28px, 6vw, 44px);
    margin: 0 0 8px;
    text-shadow: 0 0 20px rgba(241,196,15,0.5), 2px 2px 0 rgba(0,0,0,0.4);
    letter-spacing: 2px;
  }

  .subtitle {
    color: #ccc;
    font-size: clamp(14px, 3vw, 18px);
    margin: 0;
    opacity: 0.85;
  }

  .sparkles {
    font-size: 20px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.15); }
  }

  .menu-container {
    display: grid;
    grid-template-columns: repeat(2, minmax(160px, 220px));
    justify-content: center;   /* ← この1行を追加 */
    gap: 22px;
    width: 100%;
    max-width: 520px;
  }

  .game-btn {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    aspect-ratio: 1 / 0.85;
    padding: 18px 12px;
    color: white;
    text-decoration: none;
    border-radius: 18px;
    font-size: clamp(15px, 2.6vw, 19px);
    font-weight: bold;
    box-shadow: 0 6px 14px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    border: 2px solid rgba(255,255,255,0.15);
  }

  .game-btn .icon {
    font-size: clamp(30px, 6vw, 40px);
    line-height: 1;
  }

  .game-btn:hover,
  .game-btn:focus-visible {
    transform: translateY(-6px) scale(1.04);
    filter: brightness(1.1);
    box-shadow: 0 12px 22px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
  }

  .game-btn:active {
    transform: translateY(-2px) scale(0.98);
  }

  .btn-king   { background: linear-gradient(145deg, var(--red), #a83224); }
  .btn-blackjack { background: linear-gradient(145deg, var(--blue), #1f5f8b); }
  .btn-roulette  { background: linear-gradient(145deg, #444, #111); border-color: rgba(255,255,255,0.25); }
  .btn-memory    { background: linear-gradient(145deg, var(--green), #1e8449); }

  footer {
    margin-top: 40px;
    color: #666;
    font-size: 13px;
  }

  /* Small phones: single column */
  @media (max-width: 380px) {
    .menu-container {
      grid-template-columns: 1fr;
      max-width: 260px;
    }
    .game-btn {
      aspect-ratio: 3 / 1.1;
      flex-direction: row;
      gap: 14px;
    }
  }

  /* Larger screens: a touch more breathing room */
  @media (min-width: 700px) {
    .menu-container {
      grid-template-columns: repeat(4, 180px);
      max-width: none;
    }
  }
</style>
</head>
<body>

  <div class="header">
    <h1><span class="sparkles">🍻</span> 飲み会ゲームセンター <span class="sparkles">🍻</span></h1>
    <p class="subtitle">遊ぶゲームを選んでね！</p>
  </div>

  <div class="menu-container">
    <a href="King-sGame/index.html" class="game-btn btn-king">
      <span class="icon">👑</span>
      王様ゲーム
    </a>
    <a href="ブラックジャック_改良版/index.html" class="game-btn btn-blackjack">
      <span class="icon">♠️</span>
      ブラックジャック
    </a>
    <a href="roulette/index.html" class="game-btn btn-roulette">
      <span class="icon">🔫</span>
      ロシアンルーレット
    </a>
    <a href="memory/index.html" class="game-btn btn-memory">
      <span class="icon">🃏</span>
      罰ゲーム神経衰弱
    </a>
  </div>

  <footer>今夜は飲みすぎ注意 🍶</footer>

</body>
</html>
