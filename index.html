        h1 { color: #f1c40f; margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 40px; }
        .menu-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }

            padding: 20px 40px; 
            width: 300px;
            background: #e74c3c; 
            color: white; 
            text-decoration: none; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .game-btn:hover { background: #c0392b; transform: translateY(-2px); }
        .game-btn:nth-child(2) { background: #3498db; }
        .game-btn:nth-child(2):hover { background: #2980b9; }
        .game-btn:nth-child(3) { background: #2ecc71; }
        .game-btn:nth-child(3):hover { background: #27ae60; }
